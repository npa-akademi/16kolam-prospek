<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPA 17-an AI Engine</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: "#0b1120",
                        panel: "#1e293b",
                        merah: "#ef4444",
                        merahHover: "#dc2626",
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0b1120; color: #f8fafc; }
        
        .title-text {
            background: linear-gradient(135deg, #ffffff 0%, #ef4444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .output-box {
            display: none;
            background-color: #0f172a;
            border: 2px dashed #ef4444;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }

        .prompt-result {
            font-family: Consolas, Monaco, monospace;
            font-size: 0.85em;
            line-height: 1.6;
            color: #e2e8f0;
            white-space: pre-wrap;
            background: #020617;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .btn-copy {
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
        }

        .btn-copy:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(239, 68, 68, 0.4);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- HEADER -->
        <header class="mb-8 text-center border-b border-white/10 pb-6">
            <h1 class="text-4xl font-black mb-2 title-text uppercase tracking-wider">
                <i class="fa-solid fa-flag text-merah"></i> NPA 17-an AI Engine
            </h1>
            <p class="text-slate-400">Ubah foto profilmu menjadi keseruan lomba kemerdekaan HUT RI ke-81 dengan AI!</p>
        </header>

        <div class="bg-panel p-6 md:p-8 rounded-3xl border border-white/10 shadow-2xl">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <!-- GENDER / SUBJEK FOTO -->
                <div>
                    <label class="block text-sm font-semibold mb-2 text-slate-300">Subjek Foto</label>
                    <select id="inputSubjek" class="w-full bg-dark border border-slate-700 rounded-xl p-3.5 text-white focus:border-merah outline-none transition">
                        <option value="a man">Pria</option>
                        <option value="a woman">Wanita</option>
                        <option value="a family (matching the exact number of people in the reference photo)">Keluarga (Sesuai Jumlah di Foto Referensi)</option>
                    </select>
                </div>

                <!-- JENIS LOMBA -->
                <div>
                    <label class="block text-sm font-semibold mb-2 text-slate-300">Jenis Perlombaan 17-an</label>
                    <select id="inputLomba" class="w-full bg-dark border border-slate-700 rounded-xl p-3.5 text-white focus:border-merah outline-none transition">
                        <option value="Tarik Tambang (Tug of War)">Tarik Tambang</option>
                        <option value="Makan Kerupuk (Eating Cracker from a string)">Makan Kerupuk</option>
                        <option value="Balap Karung (Sack Race)">Balap Karung</option>
                        <option value="Lomba Kelereng di Sendok (Marble in spoon race)">Kelereng di Sendok</option>
                        <option value="Panjat Pinang (Greasy pole climbing)">Panjat Pinang</option>
                        <option value="Pukul Air dalam Plastik (Hitting water balloons blindfolded)">Pukul Bantal Air</option>
                    </select>
                </div>
                
                <!-- EKSPRESI WAJAH -->
                <div>
                    <label class="block text-sm font-semibold mb-2 text-slate-300">Ekspresi Wajah</label>
                    <select id="inputEkspresi" class="w-full bg-dark border border-slate-700 rounded-xl p-3.5 text-white focus:border-merah outline-none transition">
                        <option value="laughing cheerfully and looking highly spirited">Tertawa lepas & Semangat</option>
                        <option value="shouting intensely, showing immense physical effort">Teriak berjuang keras / Ngeden</option>
                        <option value="smiling brightly with eyes full of joy">Senyum ceria ke arah kamera</option>
                        <option value="looking intensely focused and determined">Fokus tajam & Serius</option>
                    </select>
                </div>

                <!-- ASPEK RASIO -->
                <div>
                    <label class="block text-sm font-semibold mb-2 text-slate-300">Aspek Rasio (Ukuran Poster)</label>
                    <select id="inputRasio" class="w-full bg-dark border border-slate-700 rounded-xl p-3.5 text-white focus:border-merah outline-none transition">
                        <option value="1:1">1:1 (Square - Feed IG)</option>
                        <option value="3:4">3:4 (Portrait Pendek)</option>
                        <option value="4:5">4:5 (Portrait Standard IG)</option>
                        <option value="9:16">9:16 (Story / Reels / TikTok)</option>
                        <option value="16:9">16:9 (Landscape / YouTube)</option>
                    </select>
                </div>

                <!-- TEKS OVERLAY -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-semibold mb-2 text-slate-300">Teks di Gambar (Opsional)</label>
                    <input type="text" id="inputTeks" class="w-full bg-dark border border-slate-700 rounded-xl p-3.5 text-white focus:border-merah outline-none transition" placeholder="Contoh: HUT RI KE-81 RT 07 RW 09" value="HUT RI KE-81 RT 07 RW 09">
                </div>
            </div>

            <button id="btnGen" class="w-full bg-merah hover:bg-merahHover text-white font-black py-4 rounded-xl shadow-lg hover:scale-[1.02] transition-transform flex items-center justify-center gap-2 text-lg">
                <i class="fa-solid fa-fire"></i> GENERATE PROMPT
            </button>

            <!-- KOTAK OUTPUT PROMPT -->
            <div class="output-box" id="outputBox">
                <div class="mb-2">
                    <h3 class="text-sm font-black text-merah uppercase tracking-wider mb-2">### IMAGE PROMPT</h3>
                    <div class="prompt-result" id="imagePrompt"></div>
                </div>

                <div class="mb-4">
                    <h3 class="text-sm font-black text-slate-400 uppercase tracking-wider mb-2">### NEGATIVE PROMPT</h3>
                    <div class="prompt-result !border-slate-700 !text-slate-400" id="negativePrompt"></div>
                </div>
                
                <!-- TOMBOL SAKTI DUAL-ACTION -->
                <button class="btn-copy" id="btnCopy">
                    <i class="fa-regular fa-copy"></i> COPY IMAGE + NEGATIVE
                </button>

                <p class="text-xs text-slate-500 mt-4 text-center">Upload foto aslimu ke ChatGPT (DALL-E 3), lalu paste prompt yang sudah disalin di atas.</p>
            </div>
        </div>
    </div>

    <!-- SCRIPT LOGIKA -->
    <script>
        document.getElementById('btnGen').addEventListener('click', function() {
            const subjek = document.getElementById('inputSubjek').value;
            const lomba = document.getElementById('inputLomba').value;
            const ekspresi = document.getElementById('inputEkspresi').value;
            const rasio = document.getElementById('inputRasio').value;
            const teks = document.getElementById('inputTeks').value.trim();

            // Membangun Image Prompt
            let imgPrompt = `Act as a Master 3D Cinematic Photographer. I will upload a reference photo. Create a highly detailed, festive, and hyper-realistic 3D illustration of ${subjek} actively participating in a traditional Indonesian Independence Day competition: ${lomba}.\n\n`;
            
            // Detail Outfit Wajib Merah Putih
            imgPrompt += `OUTFIT RULES: The subject(s) MUST be wearing festive Indonesian Independence Day outfits. Change their clothing to predominantly red and white casual wear (such as red and white t-shirts, jerseys, or sports jackets) with Indonesian national motifs.\n\n`;

            // Detail Ekspresi & Fokus
            imgPrompt += `The subject is the main focus of the image, positioned clearly in the foreground. Their facial expression is ${ekspresi}, covered in a bit of realistic sweat from the physical activity.\n\n`;
            
            // Detail Background & Bokeh/Blur
            imgPrompt += `Environment: A lively Indonesian village neighborhood celebrating 'HUT RI ke-81'. The background features opponents competing against the subject and a cheerful crowd of locals watching. IMPORTANT: Use a strong Depth of Field (bokeh effect). The subject in the front must be sharp and in perfect focus, while the opponents and the crowd in the background must be slightly blurred.\n\n`;

            // Lighting & Quality
            imgPrompt += `Cinematic sunlight, golden hour lighting, dynamic action shot, 8k resolution masterpiece. Aspect Ratio: ${rasio}.\n\n`;

            // Aturan ketat warna & layout untuk teks
            if (teks) {
                imgPrompt += `Add a large, bold, comic-book style text overlay reading exactly: "${teks.toUpperCase()}". The text must have strict uppercase formatting, a thick black outline, and use a precise sequence of white, yellow, and red colors. Place the text strategically so it doesn't cover the main subject's face.\n\n`;
            }

            // Membangun Negative Prompt
            const negPrompt = `holding flowers, holding bouquets, ugly, deformed faces, bad anatomy, bad lighting, text errors, typos, out of frame, low resolution, extra limbs, dull colors.`;

            // Tampilkan Hasil
            document.getElementById('imagePrompt').textContent = imgPrompt.trim();
            document.getElementById('negativePrompt').textContent = negPrompt;
            
            document.getElementById('outputBox').style.display = 'block';
            document.getElementById('outputBox').scrollIntoView({ behavior: 'smooth' });
        });

        // Copy Dual-Action Function
        document.getElementById('btnCopy').addEventListener('click', function() {
            const imgP = document.getElementById('imagePrompt').textContent;
            const negP = document.getElementById('negativePrompt').textContent;
            
            const fullText = `### IMAGE PROMPT\n${imgP}\n\n### NEGATIVE PROMPT\n${negP}`;
            
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(fullText).then(() => {
                    alert('Image & Negative Prompt berhasil disalin sekaligus! Silakan paste ke ChatGPT.');
                }).catch(() => fallbackCopy(fullText));
            } else { 
                fallbackCopy(fullText); 
            }
        });

        function fallbackCopy(text) {
            let textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.select();
            try { 
                document.execCommand('copy'); 
                alert('Prompt disalin (mode alternatif). Paste ke ChatGPT.'); 
            } catch (err) { 
                alert('Gagal menyalin otomatis.'); 
            }
            document.body.removeChild(textArea);
        }
    </script>
</body>
</html>
