<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPA Web Engine Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-panel: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #f59e0b;
            --primary-hover: #d97706;
            --border: #334155;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* SIDEBAR STYLING */
        .sidebar {
            width: 280px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            overflow-y: auto;
        }

        .brand {
            padding: 0 25px 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .brand h2 {
            margin: 0;
            color: var(--primary);
            font-weight: 800;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-label {
            padding: 0 25px;
            font-size: 0.75em;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .menu-list {
            list-style: none;
            padding: 0;
            margin: 0 0 30px 0;
        }

        .menu-item {
            padding: 12px 25px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
            font-weight: 600;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }

        .menu-item:hover {
            background-color: rgba(245, 158, 11, 0.1);
            color: var(--text-main);
        }

        .menu-item.active {
            background-color: rgba(245, 158, 11, 0.15);
            color: var(--primary);
            border-left-color: var(--primary);
        }

        /* MAIN CONTENT STYLING */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .header-title {
            margin: 0 0 30px 0;
            font-size: 2em;
            font-weight: 800;
        }

        .form-section {
            background-color: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            max-width: 800px;
        }

        .form-group {
            margin-bottom: 25px;
        }
        
        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .form-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-main);
            font-size: 0.95em;
        }

        .form-control {
            width: 100%;
            padding: 15px;
            background-color: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 1em;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* GRID SELECTORS (CTA & VISUAL STYLE) */
        .grid-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 15px;
        }

        .grid-item {
            background-color: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-muted);
        }

        .grid-item i {
            font-size: 1.5em;
            margin-bottom: 8px;
            display: block;
        }

        .grid-item span {
            font-size: 0.85em;
            font-weight: 600;
        }

        .grid-item:hover {
            border-color: var(--primary);
        }

        .grid-item.selected {
            background-color: rgba(245, 158, 11, 0.15);
            border-color: var(--primary);
            color: var(--primary);
        }

        /* GENERATE BUTTON */
        .btn-generate {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
            color: var(--bg-dark);
            border: none;
            padding: 18px 30px;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
        }

        /* OUTPUT BOX */
        .output-box {
            display: none;
            background-color: var(--bg-dark);
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 25px;
            margin-top: 30px;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .output-header h3 {
            margin: 0;
            color: var(--primary);
        }

        .prompt-result {
            font-family: Consolas, monospace;
            font-size: 0.9em;
            line-height: 1.6;
            color: #cbd5e1;
            white-space: pre-wrap;
            background: #111827;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .btn-copy {
            background-color: var(--bg-panel);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-copy:hover {
            background-color: var(--border);
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; flex-direction: row; flex-wrap: wrap; padding: 10px; }
            .brand { width: 100%; border-bottom: none; margin-bottom: 0; padding: 10px; }
            .menu-label { display: none; }
            .menu-list { display: flex; overflow-x: auto; margin: 0; padding: 0 10px; width: 100%; gap: 10px; }
            .menu-item { white-space: nowrap; border-left: none; border-bottom: 3px solid transparent; padding: 10px; }
            .menu-item.active { border-left: none; border-bottom-color: var(--primary); }
            .main-content { padding: 20px; }
            .grid-selector { grid-template-columns: repeat(2, 1fr); }
            .form-row { flex-direction: column; gap: 25px; }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR MENU -->
    <div class="sidebar">
        <div class="brand">
            <h2><i class="fa-solid fa-bolt"></i> NPA Engine</h2>
        </div>
        
        <div class="menu-label">Buat Website</div>
        <ul class="menu-list" id="menuList">
            <li class="menu-item active" data-type="Landing Page"><i class="fa-solid fa-rocket"></i> Landing Page</li>
            <li class="menu-item" data-type="Toko Online"><i class="fa-solid fa-store"></i> Toko Online / Katalog</li>
            <li class="menu-item" data-type="Company Profile"><i class="fa-solid fa-building"></i> Company Profile</li>
            <li class="menu-item" data-type="Portfolio"><i class="fa-solid fa-user-tie"></i> Portfolio / CV Online</li>
            <li class="menu-item" data-type="Undangan Digital"><i class="fa-solid fa-envelope-open-text"></i> Undangan Digital</li>
            <li class="menu-item" data-type="Link-in-Bio"><i class="fa-solid fa-link"></i> Link-in-Bio</li>
            <li class="menu-item" data-type="Menu F&B"><i class="fa-solid fa-utensils"></i> Menu F&B</li>
            <li class="menu-item" data-type="Halaman Jasa"><i class="fa-solid fa-handshake"></i> Halaman Jasa</li>
        </ul>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <h1 class="header-title">Setup: <span id="activeTitle" style="color: var(--primary);">Landing Page</span></h1>
        
        <div class="form-section">
            <div class="form-group">
                <label>Nama Bisnis / Tokoh</label>
                <input type="text" id="bizName" class="form-control" placeholder="Contoh: NPA Smart System">
            </div>

            <div class="form-group">
                <label>Deskripsi / Copywriting Penawaran</label>
                <textarea id="bizDesc" class="form-control" rows="4" placeholder="Jelaskan produkmu. Contoh: Sistem prospek otomatis 16 kolam khusus untuk pebisnis jaringan."></textarea>
            </div>
            
            <!-- TAMBAHAN FITUR URL GAMBAR -->
            <div class="form-row">
                <div class="form-group">
                    <label>URL Logo (Opsional)</label>
                    <input type="text" id="logoUrl" class="form-control" placeholder="https://contoh.com/logo.png">
                </div>
                <div class="form-group">
                    <label>URL Gambar Hero (Opsional)</label>
                    <input type="text" id="heroUrl" class="form-control" placeholder="https://contoh.com/hero.jpg">
                </div>
            </div>

            <div class="form-group">
                <label>Jenis Call-to-Action (CTA)</label>
                <div class="grid-selector" id="ctaGrid">
                    <div class="grid-item selected" data-cta="WhatsApp"><i class="fa-brands fa-whatsapp"></i><span>WhatsApp</span></div>
                    <div class="grid-item" data-cta="Form Lead"><i class="fa-solid fa-clipboard-list"></i><span>Form Lead</span></div>
                    <div class="grid-item" data-cta="Link Bayar"><i class="fa-solid fa-credit-card"></i><span>Link Bayar</span></div>
                </div>
            </div>

            <div class="form-group">
                <label>Target URL / Nomor WA (Opsional)</label>
                <input type="text" id="ctaTarget" class="form-control" placeholder="Contoh: 628123456789">
            </div>

            <div class="form-group">
                <label>Gaya Visual & Palet</label>
                <div class="grid-selector" id="styleGrid">
                    <div class="grid-item selected" data-style="Minimalis & Clean, dominan putih"><i class="fa-solid fa-expand"></i><span>Minimalis</span></div>
                    <div class="grid-item" data-style="Elegan & Mewah, aksen emas"><i class="fa-solid fa-gem"></i><span>Elegan</span></div>
                    <div class="grid-item" data-style="Bold & Agresif, kontras tinggi"><i class="fa-solid fa-fire"></i><span>Bold</span></div>
                    <div class="grid-item" data-style="Islami, hijau dan putih bersih"><i class="fa-solid fa-moon"></i><span>Islami</span></div>
                    <div class="grid-item" data-style="Dark Mode, neon cyberpunk"><i class="fa-solid fa-moon"></i><span>Dark</span></div>
                </div>
            </div>

            <button class="btn-generate" id="btnGen"><i class="fa-solid fa-wand-magic-sparkles"></i> Generate Brief Meta-Prompt</button>

            <!-- OUTPUT -->
            <div class="output-box" id="outputBox">
                <div class="output-header">
                    <h3>Paste di v0 / Claude / ChatGPT</h3>
                    <button class="btn-copy" id="btnCopy"><i class="fa-regular fa-copy"></i> Salin Prompt</button>
                </div>
                <div class="prompt-result" id="finalPrompt"></div>
            </div>
        </div>
    </div>

<script>
    // State Variables
    let currentType = 'Landing Page';
    let currentCTA = 'WhatsApp';
    let currentStyle = 'Minimalis & Clean, dominan putih';

    // Handle Sidebar Clicks
    const menuItems = document.querySelectorAll('.menu-item');
    menuItems.forEach(item => {
        item.addEventListener('click', function() {
            menuItems.forEach(i => i.classList.remove('active'));
            this.classList.add('active');
            currentType = this.getAttribute('data-type');
            document.getElementById('activeTitle').textContent = currentType;
        });
    });

    // Handle CTA Grid Selection
    const ctaItems = document.querySelectorAll('#ctaGrid .grid-item');
    ctaItems.forEach(item => {
        item.addEventListener('click', function() {
            ctaItems.forEach(i => i.classList.remove('selected'));
            this.classList.add('selected');
            currentCTA = this.getAttribute('data-cta');
        });
    });

    // Handle Style Grid Selection
    const styleItems = document.querySelectorAll('#styleGrid .grid-item');
    styleItems.forEach(item => {
        item.addEventListener('click', function() {
            styleItems.forEach(i => i.classList.remove('selected'));
            this.classList.add('selected');
            currentStyle = this.getAttribute('data-style');
        });
    });

    // Generate Prompt Logic
    document.getElementById('btnGen').addEventListener('click', function() {
        const name = document.getElementById('bizName').value.trim();
        const desc = document.getElementById('bizDesc').value.trim();
        const target = document.getElementById('ctaTarget').value.trim() || '#';
        const logoUrl = document.getElementById('logoUrl').value.trim();
        const heroUrl = document.getElementById('heroUrl').value.trim();

        if (!name || !desc) {
            alert('Mohon lengkapi Nama Bisnis dan Deskripsi terlebih dahulu.');
            return;
        }

        let prompt = `Act as an Expert UI/UX Designer & Senior Frontend Engineer. I need a complete, fully functional single-page HTML file utilizing Tailwind CSS (via CDN). No markdown explanations, output ONLY the raw code.\n\n`;

        prompt += `### CORE DETAILS:\n`;
        prompt += `- Type: ${currentType}\n`;
        prompt += `- Brand Name: ${name}\n`;
        prompt += `- Business Context: ${desc}\n`;
        prompt += `- Visual Style: ${currentStyle}\n`;
        prompt += `- Primary CTA Action: ${currentCTA} (Link to: ${target})\n`;
        
        if (logoUrl) {
            prompt += `- Logo Image URL to use: ${logoUrl}\n`;
        }
        if (heroUrl) {
            prompt += `- Hero/Main Image URL to use: ${heroUrl}\n`;
        }
        prompt += `\n`;

        // Logic based on Type
        prompt += `### STRUCTURE REQUIREMENTS:\n`;
        switch(currentType) {
            case 'Landing Page':
                prompt += `1. Sticky Header with Logo and CTA.\n2. Hero Section: High impact headline, subheadline, ${currentCTA} button, and prominent image display.\n3. Benefits Grid (3 columns).\n4. Testimonials Section.\n5. Final Call to Action.\n6. Footer.`;
                break;
            case 'Toko Online':
                prompt += `1. Header with Cart icon.\n2. Hero Banner promoting a sale/new arrival.\n3. Product Grid: Minimum 6 product cards (Image, Title, Price, "Add to Cart" / "${currentCTA}" button).\n4. Category filter tabs.\n5. Footer.`;
                break;
            case 'Portfolio':
                prompt += `1. Header with Anchor Links (About, Skills, Projects, Contact).\n2. Hero: Professional greeting, role, and Headshot image.\n3. Skills/Tech Stack tags.\n4. Project Gallery (Grid of cards).\n5. Contact Section using ${currentCTA} method.`;
                break;
            case 'Link-in-Bio':
                prompt += `1. Container must be max-width: 450px centered (Mobile-first look).\n2. Profile Avatar (Circle), Name, Bio.\n3. Vertical list of 5 beautifully styled action buttons (Use ${currentCTA} styling for the primary one).\n4. Row of social icons at the bottom.`;
                break;
            default:
                prompt += `Ensure standard professional sections for a ${currentType}, including a Header, Hero/Intro, Main Content area detailing the offering, and a Footer. The primary conversion goal is ${currentCTA}.`;
        }

        prompt += `\n\n### TECHNICAL REQUIREMENTS:\n`;
        prompt += `- Must use Tailwind CSS for all styling, layout (Flex/Grid), and responsiveness.\n`;
        prompt += `- Include FontAwesome CDN for modern iconography.\n`;
        prompt += `- Include Google Fonts matching the chosen visual style.\n`;
        prompt += `- Add hover states and smooth transitions for interactive elements.\n`;
        if (logoUrl || heroUrl) {
            prompt += `- CRITICAL: Do NOT use placeholder images for the Logo and Hero section. You MUST use the exact image URLs provided in the Core Details above.\n`;
        }

        document.getElementById('finalPrompt').textContent = prompt;
        document.getElementById('outputBox').style.display = 'block';
        
        // Scroll to output
        document.getElementById('outputBox').scrollIntoView({ behavior: 'smooth' });
    });

    // Fallback Copy Function
    document.getElementById('btnCopy').addEventListener('click', function() {
        const textToCopy = document.getElementById('finalPrompt').textContent;
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert('Brief meta-prompt berhasil disalin! Paste ke ChatGPT / v0 / Claude.');
            }).catch(() => fallbackCopy(textToCopy));
        } else {
            fallbackCopy(textToCopy);
        }
    });

    function fallbackCopy(text) {
        let textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.opacity = "0";
        document.body.appendChild(textArea);
        textArea.select();
        try {
            document.execCommand('copy');
            alert('Brief disalin (mode alternatif). Paste ke ChatGPT / v0 / Claude.');
        } catch (err) {
            alert('Gagal menyalin otomatis. Silakan blok teks manual.');
        }
        document.body.removeChild(textArea);
    }
</script>
</body>
</html>
